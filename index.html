<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EE5A24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hausaufgaben">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Hausaufgaben V&amp;M</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: App-Shell — Verlaufsleiste oben, Seitennavigation am Desktop, Tab-Leiste am Handy; der Monatskalender ist die Startfläche */
:root{
  --a:#EE5A24;            /* Akzent 1 (Orange) */
  --b:#D62839;            /* Akzent 2 (Rot) */
  --pV:#8C4FE3;           /* V: Lila */
  --pM:#7DC31A;           /* M: Limettengrün */
  --surface:#FFFFFF;
  --bg:color-mix(in oklab, var(--a) 5%, #FFFFFF);
  --ink:#221613;
  --ink-2:color-mix(in oklab, var(--ink) 72%, var(--surface));
  --muted:color-mix(in oklab, var(--ink) 52%, var(--surface));
  --line:color-mix(in oklab, var(--a) 14%, #E7E2DF);
  --tint:color-mix(in oklab, var(--a) 8%, var(--surface));
  --tint-2:color-mix(in oklab, var(--a) 16%, var(--surface));
  --a-text:color-mix(in oklab, var(--a) 82%, #000);
  --late:#C9242F; --soon:#C46A00; --ok:#2E8B57;
  --scrim:rgb(25 12 6 / .45);
  --shadow:0 1px 2px rgb(40 20 10 / .06), 0 10px 30px -14px rgb(40 20 10 / .25);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px; --r-sm:10px;
}
:root[data-palette="ozean"]{--a:#0B7FC1;--b:#0E9A9A}
:root[data-palette="wald"]{--a:#2F8F4E;--b:#6E8F12}
:root[data-palette="beere"]{--a:#C2185B;--b:#7B3FB5}
:root[data-palette="sonne"]{--a:#DB8600;--b:#E2551B}
:root[data-palette="graphit"]{--a:#4F5D6B;--b:#1F2933}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --surface:#1E1816;
    --bg:color-mix(in oklab, var(--a) 6%, #110D0C);
    --ink:#F6ECE7;
    --line:color-mix(in oklab, var(--a) 16%, #3A302C);
    --tint:color-mix(in oklab, var(--a) 12%, var(--surface));
    --tint-2:color-mix(in oklab, var(--a) 24%, var(--surface));
    --a-text:color-mix(in oklab, var(--a) 70%, #fff);
    --late:#FF6B6B; --soon:#FFB347; --ok:#5BD08A;
    --scrim:rgb(0 0 0 / .6);
    --shadow:0 1px 2px rgb(0 0 0 / .3), 0 10px 30px -12px rgb(0 0 0 / .7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface:#1E1816;
  --bg:color-mix(in oklab, var(--a) 6%, #110D0C);
  --ink:#F6ECE7;
  --line:color-mix(in oklab, var(--a) 16%, #3A302C);
  --tint:color-mix(in oklab, var(--a) 12%, var(--surface));
  --tint-2:color-mix(in oklab, var(--a) 24%, var(--surface));
  --a-text:color-mix(in oklab, var(--a) 70%, #fff);
  --late:#FF6B6B; --soon:#FFB347; --ok:#5BD08A;
  --scrim:rgb(0 0 0 / .6);
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 10px 30px -12px rgb(0 0 0 / .7);
}

*{box-sizing:border-box}
:root{color-scheme:light; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none !important}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font:400 15px/1.5 var(--f-body); -webkit-font-smoothing:antialiased}
body.modal-open{overflow:hidden}
button{font:inherit; color:inherit; cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--a); outline-offset:2px}
h1,h2,h3{font-family:var(--f-display); text-wrap:balance; margin:0; letter-spacing:-.01em}
h1{font-size:clamp(26px,4.2vw,38px); font-weight:800; line-height:1.05}
h2{font-size:20px; font-weight:800}
h3{font-size:13px; font-family:var(--f-body); font-weight:700; text-transform:uppercase; letter-spacing:.09em; color:var(--muted)}
p{margin:0}
.ic{flex:none; display:block}
.eyebrow{font:700 12px/1.2 var(--f-body); text-transform:uppercase; letter-spacing:.1em; color:var(--a-text); margin-bottom:6px}
.num{font-variant-numeric:tabular-nums}

/* Avatare */
.av{--pc:var(--pV); display:inline-grid; place-items:center; width:32px; height:32px; border-radius:50%; background:var(--pc); color:#fff; font:800 15px/1 var(--f-display); text-shadow:0 1px 1px rgb(0 0 0 / .28); flex:none; user-select:none}
.av-M{--pc:var(--pM)}
.av.sm{width:22px; height:22px; font-size:11px}
.av.lg{width:76px; height:76px; font-size:36px}

/* Kopfleiste */
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 16px; background:linear-gradient(100deg,var(--a),var(--b)); color:#fff}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.duo{display:flex}
.duo .av{box-shadow:0 0 0 2px #fff}
.duo .av + .av{margin-left:-8px}
.brand-name{font:800 20px/1 var(--f-display); letter-spacing:-.01em; white-space:nowrap}
.top-actions{display:flex; align-items:center; gap:8px}
.sync{display:inline-flex; align-items:center; gap:6px; font:600 12px var(--f-body); padding:4px 10px; border-radius:999px; background:rgb(255 255 255 / .16); white-space:nowrap}
.sync::before{content:""; width:7px; height:7px; border-radius:50%; background:#fff; opacity:.6}
.sync.live::before{background:#7CF0A6; opacity:1}
.sync.local::before{background:#FFD166; opacity:1}
.help-btn{position:relative; display:grid; place-items:center; width:40px; height:40px; border-radius:12px; border:0; background:rgb(255 255 255 / .18); color:#fff}
.help-btn:hover{background:rgb(255 255 255 / .28)}
.help-btn.mine{background:#fff; color:var(--b)}
.help-btn.alert{background:#fff; color:var(--b); animation:ring 1.1s ease-in-out infinite}
.help-btn .dot{position:absolute; top:-3px; right:-3px}
.me-btn{border:0; background:none; padding:0; border-radius:50%}
.me-btn .av{box-shadow:0 0 0 2px #fff}
.me-btn .av.none{background:rgb(255 255 255 / .25)}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
@media (max-width:520px){ .sync span{display:none} .sync{padding:6px} .brand-name{font-size:18px} }

/* Gerüst */
.shell{display:grid; grid-template-columns:1fr; min-height:calc(100% - 60px)}
.sidenav{display:none}
.content{min-width:0; width:100%; max-width:1240px; margin-inline:auto; padding-inline:16px; padding-block:18px 140px}
@media (min-width:900px){
  .shell{grid-template-columns:232px minmax(0,1fr)}
  .sidenav{display:flex; flex-direction:column; gap:4px; padding:18px 12px; border-right:1px solid var(--line); background:var(--surface); position:sticky; top:calc(60px + env(safe-area-inset-top,0px)); height:calc(100vh - 60px); align-self:start}
  .content{padding-inline:28px; padding-block:26px 80px}
  .tabbar{display:none !important}
}
.navbtn{display:flex; align-items:center; gap:12px; padding:10px 12px; border:0; border-radius:10px; background:none; font-weight:600; color:var(--ink-2); text-align:left}
.navbtn:hover{background:var(--tint)}
.navbtn[aria-current="page"]{background:var(--tint-2); color:var(--a-text)}
.navbtn .lbl{flex:1}
.badge{display:inline-grid; place-items:center; min-width:20px; height:20px; padding:0 6px; border-radius:999px; background:var(--b); color:#fff; font:700 11px/1 var(--f-body); font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto; padding:12px; font-size:12px; color:var(--muted)}

.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:30; display:grid; grid-template-columns:repeat(4,1fr); background:var(--surface); border-top:1px solid var(--line); padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbtn{position:relative; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px; border:0; background:none; font:600 11px var(--f-body); color:var(--muted); border-radius:10px}
.tabbtn[aria-current="page"]{color:var(--a-text)}
.tabbtn[aria-current="page"] .ic{transform:translateY(-1px)}
.tabbtn .badge{position:absolute; top:0; left:calc(50% + 6px); height:17px; min-width:17px; font-size:10px; padding:0 4px}

.fab{position:fixed; right:16px; bottom:calc(78px + env(safe-area-inset-bottom,0px)); z-index:31; display:flex; align-items:center; gap:8px; height:54px; padding:0 20px 0 16px; border:0; border-radius:18px; background:linear-gradient(120deg,var(--a),var(--b)); color:#fff; font:700 15px var(--f-body); box-shadow:0 10px 24px -8px color-mix(in oklab, var(--b) 70%, transparent)}
.fab:hover{filter:brightness(1.05)}
@media (min-width:900px){ .fab{bottom:24px; right:28px} }

/* Hilfe-Banner */
#banner{display:grid; gap:10px}
#banner:not(:empty){margin-bottom:18px}
.help-banner{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 14px; border-radius:var(--r); background:linear-gradient(100deg,var(--b),var(--a)); color:#fff; box-shadow:var(--shadow)}
.help-banner.mine{background:var(--surface); color:var(--ink); border:1px dashed color-mix(in oklab, var(--b) 50%, var(--line)); box-shadow:none}
.help-ico{display:grid; place-items:center; width:44px; height:44px; border-radius:12px; background:#fff; color:var(--b); flex:none; animation:ring 1.4s ease-in-out infinite}
.help-banner.mine .help-ico{background:var(--tint-2); color:var(--b); animation:none}
.hb-text{flex:1 1 220px; min-width:0; display:grid; gap:2px}
.hb-text b{font:800 17px/1.2 var(--f-display)}
.hb-text span{font-size:14px; opacity:.92; overflow-wrap:anywhere}
.hb-actions{display:flex; gap:8px; flex-wrap:wrap}

/* Knöpfe */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; height:40px; padding:0 16px; border-radius:11px; border:1px solid transparent; font:600 14px var(--f-body); background:var(--tint-2); color:var(--ink); white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--a); color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent; border-color:var(--line)}
.btn.ghost:hover{background:var(--tint)}
.btn.sm{height:34px; padding:0 12px; font-size:13px; border-radius:9px}
.btn.light{background:#fff; color:var(--b); border-color:#fff}
.btn.onacc{background:rgb(255 255 255 / .16); color:#fff; border-color:rgb(255 255 255 / .5)}
.btn.danger{color:var(--late)}
.btn[data-armed]{background:var(--late); color:#fff; border-color:var(--late)}
.btn:disabled{opacity:.55}
.iconbtn{display:grid; place-items:center; width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink-2)}
.iconbtn:hover{background:var(--tint)}

/* Segment-Schalter */
.seg{display:inline-flex; flex-wrap:wrap; background:var(--tint); border-radius:11px; padding:3px; gap:2px}
.seg button{display:inline-flex; align-items:center; gap:6px; border:0; background:transparent; padding:6px 12px; border-radius:8px; font:600 13px var(--f-body); color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--a-text); box-shadow:0 1px 3px rgb(0 0 0 / .1)}
.toggle{display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font:600 13px var(--f-body); color:var(--ink-2)}
.toggle[aria-pressed="true"]{background:var(--a); border-color:var(--a); color:#fff}

/* Seitenkopf */
.page-head,.month-head{display:flex; align-items:flex-end; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:18px}
.month-nav{display:flex; align-items:center; gap:6px}
.toolbar{display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; margin-bottom:20px; padding:12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r)}
.tool{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.tool-label{font:700 11px var(--f-body); text-transform:uppercase; letter-spacing:.09em; color:var(--muted)}
.select{height:34px; padding:0 30px 0 10px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:600 13px var(--f-body)}

/* Monatsfakten */
.month-facts{display:flex; flex-wrap:wrap; gap:0; margin:0 0 20px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.month-facts > div{flex:1 1 130px; padding:12px 16px; border-right:1px solid var(--line); margin:0}
.month-facts > div:last-child{border-right:0}
.month-facts dt{font:600 12px var(--f-body); color:var(--muted)}
.month-facts dd{margin:2px 0 0; font:800 28px/1.1 var(--f-display); font-variant-numeric:tabular-nums}
.month-facts .next{flex:2 1 230px; background:var(--tint)}
.month-facts .next dd{font:700 15px/1.35 var(--f-body); display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:6px}
@media (max-width:560px){ .month-facts > div{flex-basis:45%; border-bottom:1px solid var(--line)} }

/* Erinnerungen */
.reminders{margin-bottom:22px}
.rem-head{display:flex; align-items:center; gap:8px; margin-bottom:10px; color:var(--a-text)}
.rem-head h3{color:inherit}
.rem-row{display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; scroll-snap-type:x proximity}
.rem-row .card{flex:0 0 min(290px,84%); scroll-snap-align:start}

/* Kalender */
.cal-bar{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px}
.cal-layout{display:grid; gap:18px}
@media (min-width:1120px){ .cal-layout{grid-template-columns:minmax(0,1fr) 330px; align-items:start} }
.cal{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.cal-dow{background:var(--tint); padding:8px 8px; font:700 11px var(--f-body); text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
.day{display:flex; flex-direction:column; align-items:stretch; gap:3px; min-height:104px; padding:6px; border:0; background:var(--surface); text-align:left; min-width:0}
.day:hover{background:var(--tint)}
.day.out{background:color-mix(in oklab, var(--surface) 55%, var(--bg))}
.day.out .dnum{color:var(--muted)}
.day.weekend .dnum{color:var(--muted)}
.dnum{display:inline-grid; place-items:center; align-self:flex-start; min-width:26px; height:26px; padding:0 4px; border-radius:999px; font:700 13px var(--f-body); font-variant-numeric:tabular-nums}
.day.today .dnum{background:var(--a); color:#fff}
.day.sel{box-shadow:inset 0 0 0 2px var(--a)}
.dchip{display:block; min-width:0; padding:2px 6px; border-radius:6px; font:600 11.5px/1.3 var(--f-body); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:color-mix(in oklab, var(--c) 15%, var(--surface)); color:var(--ink)}
.dchip.k-ka{background:var(--b); color:#fff}
.dchip.k-test{background:var(--a); color:#fff}
.dchip.k-pres{background:color-mix(in oklab, var(--b) 18%, var(--surface)); color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--b)}
.dchip.k-event{background:transparent; box-shadow:inset 0 0 0 1px var(--line); color:var(--ink-2)}
.dchip.done{opacity:.45; text-decoration:line-through}
.dmore{font:600 11px var(--f-body); color:var(--muted); padding-left:4px}
@media (max-width:640px){
  .day{min-height:62px; padding:4px; gap:2px}
  .dnum{min-width:24px; height:24px; font-size:12px}
  .dchip{font-size:0; height:5px; padding:0; border-radius:3px; background:var(--c)}
  .dchip.k-ka,.dchip.k-test,.dchip.k-pres{height:7px}
  .dchip.k-pres{background:var(--b)}
  .dchip.k-event{background:var(--muted)}
  .dmore{font-size:10px; padding:0}
  .cal-dow{padding:6px 2px; text-align:center; letter-spacing:0}
}
.daypanel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; display:grid; gap:12px}
.daypanel .cards{gap:8px}
.add-day{justify-self:start}
.empty-sm{color:var(--muted); font-size:14px}

/* Karten */
.groups{display:grid; gap:24px}
.group-h{display:flex; align-items:center; gap:8px; margin-bottom:10px; font:700 13px var(--f-body); text-transform:uppercase; letter-spacing:.09em; color:var(--muted)}
.group-h.late{color:var(--late)}
.group-h .count{font-variant-numeric:tabular-nums; font-weight:600; opacity:.8}
.cards{display:grid; gap:10px}
@media (min-width:760px){ .groups .cards{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))} }
.card{display:flex; align-items:center; gap:12px; padding:13px 14px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); cursor:pointer; min-width:0}
.card:hover{border-color:color-mix(in oklab, var(--a) 45%, var(--line))}
.card-main{flex:1; min-width:0; display:grid; gap:4px}
.card-top{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.subj{display:inline-flex; align-items:center; gap:6px; font:700 12.5px var(--f-body); color:var(--ink-2)}
.subj i{width:9px; height:9px; border-radius:3px; background:var(--c); flex:none}
.star{color:var(--a-text); font-weight:700}
.card-title{font:600 16px/1.3 var(--f-body); overflow-wrap:anywhere}
.card.is-done .card-title{text-decoration:line-through; color:var(--muted)}
.card-meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px; color:var(--muted)}
.card-side{flex:none; display:flex; align-items:center}
.att{display:inline-flex; align-items:center; gap:3px}
.att.new{color:var(--b); font-weight:700}
.only{font:700 11px var(--f-body); padding:1px 7px; border-radius:999px; background:var(--tint); color:var(--ink-2)}
.pill{display:inline-flex; align-items:center; font:700 12px/1.5 var(--f-body); padding:1px 8px; border-radius:999px; background:var(--tint); color:var(--ink-2); white-space:nowrap}
.u-late{background:color-mix(in oklab, var(--late) 15%, var(--surface)); color:var(--late)}
.u-soon{background:color-mix(in oklab, var(--soon) 16%, var(--surface)); color:var(--soon)}
.u-done{background:color-mix(in oklab, var(--ok) 14%, var(--surface)); color:var(--ok)}
.kb{display:inline-flex; font:800 10.5px/1.6 var(--f-body); letter-spacing:.06em; text-transform:uppercase; padding:0 7px; border-radius:6px; white-space:nowrap}
.kb-ka{background:var(--b); color:#fff}
.kb-test{background:var(--a); color:#fff}
.kb-pres{box-shadow:inset 0 0 0 1.5px var(--b); color:var(--ink)}
.kb-event{box-shadow:inset 0 0 0 1px var(--line); color:var(--ink-2)}
.kb-hw{background:var(--tint-2); color:var(--ink-2)}
.count-box{display:grid; justify-items:center; min-width:56px; padding:6px 8px; border-radius:12px; background:var(--tint)}
.count-box b{font:800 24px/1 var(--f-display); font-variant-numeric:tabular-nums}
.count-box span{font:600 11px var(--f-body); color:var(--muted)}
.count-box.hot{background:color-mix(in oklab, var(--late) 14%, var(--surface)); color:var(--late)}
.count-box.hot span{color:inherit}

/* Häkchen pro Person */
.ticks{display:flex; gap:6px}
.tick{--pc:var(--pV); display:grid; place-items:center; width:34px; height:34px; border-radius:50%; border:2px solid var(--pc); background:transparent; color:var(--pc); font:800 15px var(--f-display); padding:0; transition:background-color .25s, color .25s}
.tick.p-M{--pc:var(--pM)}
.tick.on{background:var(--pc); color:#fff; text-shadow:0 1px 1px rgb(0 0 0 / .28)}
.tick:not(:disabled):hover{transform:scale(1.07)}
.tick:disabled:not(.on){opacity:.5}
.tick[data-action="nudge"]{box-shadow:0 0 0 3px color-mix(in oklab, var(--pc) 32%, transparent)}
.ticks.big{flex-wrap:wrap}
.ticks.big .tick{width:auto; height:42px; border-radius:999px; padding:0 14px 0 5px; gap:8px; display:inline-flex; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:600 14px var(--f-body); text-shadow:none}
.ticks.big .tick .tk{display:grid; place-items:center; width:30px; height:30px; border-radius:50%; border:2px solid var(--pc); color:var(--pc); font:800 14px var(--f-display); transition:background-color .25s, color .25s}

.ticks.big .tick.on .tk{background:var(--pc); color:#fff; text-shadow:0 1px 1px rgb(0 0 0 / .28)}

.by{display:inline-flex; align-items:center; gap:5px; margin-left:auto; font:600 12px var(--f-body); color:var(--muted); white-space:nowrap}
.odone{font-weight:700; color:color-mix(in oklab, var(--pc) 70%, var(--ink))}

.empty{display:grid; justify-items:start; gap:10px; padding:28px; background:var(--surface); border:1px dashed var(--line); border-radius:var(--r)}
.empty h2{font-size:22px}
.empty p{color:var(--ink-2); max-width:52ch}
.notice{padding:10px 14px; border-radius:var(--r-sm); background:var(--tint); color:var(--ink-2); font-size:14px; margin-bottom:16px}

#modal-root{position:fixed; inset:0; z-index:50; display:grid; align-items:end; justify-items:center}
.scrim{position:absolute; inset:0; background:var(--scrim)}
.sheet{position:relative; width:min(640px,100%); max-height:92vh; max-height:92dvh; overflow:auto; background:var(--surface); color:var(--ink); border-radius:22px 22px 0 0; padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px)); box-shadow:var(--shadow); animation:up .22s ease-out}

@keyframes up{from{transform:translateY(24px); opacity:.6}to{transform:none; opacity:1}}
.sheet-x{position:absolute; top:14px; right:14px}
.sheet h2{font-size:24px; padding-right:44px}
.sheet .lead{color:var(--ink-2); margin-top:6px}
.form{display:grid; gap:16px; margin-top:18px}
.field{display:grid; gap:6px}
.field > span,.field > legend{font:700 13px var(--f-body); color:var(--ink-2); padding:0}
fieldset.field{border:0; margin:0; padding:0; min-width:0}
.input{width:100%; min-height:44px; padding:10px 12px; border-radius:11px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:400 16px var(--f-body)}
textarea.input{resize:vertical; min-height:84px; line-height:1.45}
.input:focus{outline:2px solid var(--a); outline-offset:0; border-color:transparent}
.row2{display:grid; gap:16px; grid-template-columns:1fr 1fr}

.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip-r{position:relative}
.chip-r input{position:absolute; opacity:0; pointer-events:none}
.chip-r span{display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 13px; border-radius:999px; border:1px solid var(--line); font:600 14px var(--f-body); color:var(--ink-2); cursor:pointer; background:var(--surface)}
.chip-r input:checked + span{background:var(--a); border-color:var(--a); color:#fff}
.chip-r input:focus-visible + span{outline:2px solid var(--a); outline-offset:2px}
.err{color:var(--late); font-size:13px; font-weight:600}
.form-foot{display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap}

.dt-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; padding-right:44px}
.dt-title{font-size:26px; overflow-wrap:anywhere}

.dt-done{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:16px; padding:12px; border-radius:var(--r-sm); background:var(--tint)}
.dt-done > span{font-weight:700}
.dt-desc{margin-top:14px; white-space:pre-wrap; overflow-wrap:anywhere; max-width:65ch}
.dt-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px}
.dt-by{margin-top:10px; font-size:12.5px; color:var(--muted)}
.dt-sec{margin-top:22px; padding-top:18px; border-top:1px solid var(--line); display:grid; gap:12px}
.topics{list-style:none; margin:0; padding:0; display:grid; gap:6px}
.topics li{display:flex; align-items:center; gap:10px; padding:8px 8px 8px 12px; border-radius:10px; background:var(--tint)}
.topics li span{flex:1; overflow-wrap:anywhere}
.topics .iconbtn{width:30px; height:30px; background:transparent; border-color:transparent}
.inline-form{display:flex; gap:8px}
.inline-form .input{min-height:40px; padding:8px 12px}
.notes{display:grid; gap:12px}
.note{display:flex; gap:10px; align-items:flex-start}
.note-body{flex:1; min-width:0; padding:10px 12px; border-radius:4px 14px 14px 14px; background:var(--tint)}
.note.mine .note-body{background:var(--tint-2)}
.note-meta{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted)}
.note-meta b{color:var(--ink)}
.note-meta .iconbtn{width:26px; height:26px; margin-left:auto; border-color:transparent; background:transparent}
.iconbtn[data-armed]{background:var(--late) !important; color:#fff !important}
.note-text{margin-top:4px; white-space:pre-wrap; overflow-wrap:anywhere}
.note-files{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px}
.thumb{padding:0; border:0; border-radius:10px; overflow:hidden; width:120px; height:96px; background:var(--surface)}
.thumb img{width:100%; height:100%; object-fit:cover; display:block}
.filechip{display:inline-flex; align-items:center; gap:6px; max-width:100%; padding:8px 12px; border-radius:10px; background:var(--surface); border:1px solid var(--line); color:var(--ink); text-decoration:none; font:600 13px var(--f-body)}

.pending{display:flex; flex-wrap:wrap; gap:6px}

.switch{width:44px; height:26px; accent-color:var(--a)}
.subj-list{display:grid; gap:6px}

.subj-row .input{min-height:36px; padding:6px 10px; font-size:15px}
.mainbtn{height:36px; padding:0 10px; border-radius:9px; border:1px solid var(--line); background:var(--surface); font:600 12.5px var(--f-body); color:var(--muted); white-space:nowrap}
.mainbtn[aria-pressed="true"]{background:var(--tint-2); color:var(--a-text); border-color:transparent}
.names{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media (max-width:480px){ .names{grid-template-columns:1fr} .subj-row{grid-template-columns:40px minmax(0,1fr) auto} .subj-row .del{grid-column:3} .subj-row .mainbtn{grid-column:2 / 3; justify-self:start} }
.name-field{display:flex; align-items:center; gap:10px}

/* Toasts + Lightbox */
#toasts{position:fixed; left:50%; transform:translateX(-50%); top:calc(70px + env(safe-area-inset-top,0px)); z-index:80; display:grid; gap:8px; width:min(420px,calc(100% - 32px)); pointer-events:none}
.toast{display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:12px; background:var(--ink); color:var(--surface); font:600 14px var(--f-body); box-shadow:var(--shadow); pointer-events:auto; animation:up .2s ease-out}
.toast.err{background:var(--late); color:#fff}
.toast.help{background:linear-gradient(100deg,var(--b),var(--a)); color:#fff}
#lightbox{position:fixed; inset:0; z-index:90; background:rgb(0 0 0 / .86); display:grid; place-items:center; padding:20px}
#lightbox img{max-width:100%; max-height:calc(100% - 70px); border-radius:8px; object-fit:contain}
#lightbox .lb-bar{position:absolute; top:calc(12px + env(safe-area-inset-top,0px)); right:12px; display:flex; gap:8px}
#lightbox .iconbtn{background:rgb(255 255 255 / .14); color:#fff; border-color:transparent; text-decoration:none}

.skel{color:var(--muted)}
body.locked .sidenav, body.locked .tabbar, body.locked .fab, body.locked .top-actions{display:none !important}
body.locked .shell{grid-template-columns:1fr}
.login{max-width:440px; margin:6vh auto 0; display:grid; gap:12px; padding:26px; background:var(--surface); border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow)}
.login .lead{color:var(--ink-2)}
.login .form{margin-top:4px}
.login-duo{display:flex}
.login-duo .av{box-shadow:0 0 0 3px var(--surface)}
.login-duo .av + .av{margin-left:-14px}
.topic{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 12px; border-radius:var(--r-sm); background:var(--tint)}
.topic code{flex:1 1 200px; font:600 14px ui-monospace,Consolas,monospace; overflow-wrap:anywhere; color:var(--ink)}
.steps{margin:0; padding-left:20px; display:grid; gap:6px; color:var(--ink-2); font-size:14px; max-width:65ch}
.steps a{color:var(--a-text); font-weight:600}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none !important; transition:none !important} }

/* ---------- Speicher (Live-Datenbank oder lokal) ---------- */
function deepMerge(t, s){
  const o = Object.assign({}, t);
  for (const k in s){
    const v = s[k];
    if (v && typeof v === 'object' && !Array.isArray(v) && o[k] && typeof o[k] === 'object' && !Array.isArray(o[k])) o[k] = deepMerge(o[k], v);
    else o[k] = v;
  }
  return o;
}
const parentOf = p => p.split('/').slice(0, -1).join('/');
function dbErr(e){
  const msg = String((e && (e.message || e.error_description)) || e || '');
  if (e && (e.code === '42501' || /row-level security|permission|JWT/i.test(msg))) return {code:'invalid_argument', message: msg};
  if (/fetch|network|timeout/i.test(msg)) return {code:'unavailable', message: msg};
  return {code: (e && e.code) || 'unknown', message: msg};
}
/* Alle Dokumente liegen in einer Tabelle "docs" (path → data). Der Cache spiegelt sie, Realtime hält ihn aktuell. */
const Store = {
  mode: 'connecting', cache: new Map(), subs: [], loaded: false, channel: null, dropped: false,
  list(coll){ const out = []; for (const [p, d] of this.cache) if (parentOf(p) === coll) out.push(Object.assign({id: p.split('/').pop()}, d)); return out; },
  fire(coll){ this.subs.forEach(s => { if (coll === undefined || s.coll === coll) s.fire(); }); },
  async loadAll(){
    const rows = [];
    for (let from = 0; ; from += 1000){
      const {data, error} = await S.sb.from('docs').select('path,data').range(from, from + 999);
      if (error) throw dbErr(error);
      rows.push.apply(rows, data);
      if (data.length < 1000) break;
    }
    this.cache = new Map(rows.map(r => [r.path, r.data || {}]));
    this.loaded = true;
    this.fire();
  },
  connect(){
    if (this.channel) S.sb.removeChannel(this.channel);
    this.channel = S.sb.channel('docs-live')
      .on('postgres_changes', {event:'*', schema:'public', table:'docs'}, ev => {
        if (ev.eventType === 'DELETE'){ const p = ev.old && ev.old.path; if (p && this.cache.delete(p)) this.fire(parentOf(p)); }
        else if (ev.new && ev.new.path){ this.cache.set(ev.new.path, ev.new.data || {}); this.fire(parentOf(ev.new.path)); }
      })
      .subscribe(status => {
        if (status === 'SUBSCRIBED'){
          const was = this.dropped; this.dropped = false; this.mode = 'db'; renderChrome(); renderBanner();
          if (was) this.loadAll().catch(() => {});
        } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED'){
          this.dropped = true; this.mode = 'offline'; renderChrome(); renderBanner();
        }
      });
  },
  watchCollection(coll, cb){
    const sub = {coll, fire: () => cb(this.list(coll))};
    this.subs.push(sub);
    if (this.loaded) setTimeout(sub.fire, 0);
    return () => { this.subs = this.subs.filter(x => x !== sub); };
  },
  async getDoc(path){ return this.cache.get(path) || null; },
  async getCollection(coll){ return this.list(coll); },
  async set(path, data){
    const prev = this.cache.get(path), coll = parentOf(path);
    this.cache.set(path, JSON.parse(JSON.stringify(data))); this.fire(coll);
    const {error} = await S.sb.from('docs').upsert({path, coll, data, updated_at: new Date().toISOString()});
    if (error){ if (prev === undefined) this.cache.delete(path); else this.cache.set(path, prev); this.fire(coll); throw dbErr(error); }
  },
  async update(path, patch){
    const prev = this.cache.get(path), coll = parentOf(path);
    if (prev){ this.cache.set(path, deepMerge(prev, JSON.parse(JSON.stringify(patch)))); this.fire(coll); }
    const {error} = await S.sb.rpc('merge_doc', {p_path: path, p_patch: patch});
    if (error){ if (prev){ this.cache.set(path, prev); this.fire(coll); } throw dbErr(error); }
  },
  async del(path){
    const prev = this.cache.get(path), coll = parentOf(path);
    this.cache.delete(path); this.fire(coll);
    const {error} = await S.sb.from('docs').delete().eq('path', path);
    if (error){ if (prev !== undefined){ this.cache.set(path, prev); this.fire(coll); } throw dbErr(error); }
  },
  newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
};
/* Fotos und PDFs liegen im privaten Speicher-Bucket "files"; angezeigt werden sie über zeitlich begrenzte Links. */
const Files = {
  urls: {}, tried: {},
  url(id){ const u = this.urls[id]; return u && u.exp > Date.now() ? u.url : ''; },
  async ensure(ids){
    const need = Array.from(new Set(ids)).filter(id => !this.url(id) && !this.tried[id]);
    if (!need.length) return false;
    need.forEach(id => this.tried[id] = true);
    const {data, error} = await S.sb.storage.from('files').createSignedUrls(need, 6 * 3600);
    if (error || !data) return false;
    let got = false;
    data.forEach(d => { const u = d.signedUrl || d.signedURL; if (u && d.path){ this.urls[d.path] = {url: u, exp: Date.now() + 5.5 * 3600 * 1000}; delete this.tried[d.path]; got = true; } });
    return got;
  },
  async upload(blob, opts){
    const type = (opts && opts.type) || blob.type || '';
    const ext = {'image/jpeg':'jpg', 'image/png':'png', 'image/webp':'webp', 'image/gif':'gif', 'application/pdf':'pdf'}[type];
    if (!ext) throw {code:'unsupported_type'};
    if (blob.size > 20 * 1048576) throw {code:'too_large'};
    const path = `${Store.newId()}-${Math.random().toString(36).slice(2, 10)}.${ext}`;
    const {error} = await S.sb.storage.from('files').upload(path, blob, {contentType: type, upsert: false});
    if (error){ const m = String(error.message || ''); throw {code: /size|large|413/i.test(m) ? 'too_large' : /mime|type/i.test(m) ? 'unsupported_type' : /quota/i.test(m) ? 'quota_or_state' : 'upstream_error'}; }
    return {id: path, contentType: type, sizeBytes: blob.size};
  },
  async delete(id){ const {error} = await S.sb.storage.from('files').remove([id]); if (error) throw error; return {deleted: true}; }
};
const queues = {};
function write(path, op, data){
  if (!Store.loaded){ toast('Verbinde noch … Versuch es gleich nochmal.', 'err'); return Promise.reject({code:'connecting'}); }
  const run = async () => {
    for (let attempt = 0; attempt < 2; attempt++){
      try {
        if (op === 'set') return await Store.set(path, data);
        if (op === 'update') return await Store.update(path, data);
        return await Store.del(path);
      } catch(e){
        if (e && e.code === 'unavailable' && attempt === 0){ await sleep(400 + Math.random() * 700); continue; }
        reportWriteError(e); throw e;
      }
    }
  };
  const p = (queues[path] || Promise.resolve()).catch(() => {}).then(run);
  queues[path] = p;
  return p;
}
function reportWriteError(e){
  const c = e && e.code;
  if (c === 'quota_exceeded') toast('Der Speicher ist voll. Lösche alte Einträge oder Dateien.', 'err');
  else if (c === 'invalid_argument') toast('Speichern nicht erlaubt. Melde dich unter Einstellungen ab und wieder an.', 'err');
  else if (c === 'resource_exhausted') toast('Gerade zu viele Änderungen auf einmal. Versuch es gleich nochmal.', 'err');
  else toast('Konnte nicht speichern. Prüfe die Internetverbindung.', 'err');
}

/* ---------- Toasts, Ton, Mitteilungen ---------- */
function toast(msg, kind){
  const t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), kind === 'err' ? 6000 : 4200);

function chime(){
  try {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    const ctx = S.actx || (S.actx = new C());
    if (ctx.state === 'suspended') ctx.resume();
    const t = ctx.currentTime;
    [880, 1175, 1568].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      const s = t + i * .16;
      g.gain.setValueAtTime(.0001, s); g.gain.exponentialRampToValueAtTime(.22, s + .02); g.gain.exponentialRampToValueAtTime(.0001, s + .38);
      o.connect(g); g.connect(ctx.destination); o.start(s); o.stop(s + .42);
    });
  } catch(e){}
}
/* Push-Nachrichten über ntfy.sh: jede Person hat einen eigenen geheimen Kanal (prefix-V, prefix-M). */
const appUrl = () => location.origin + location.pathname;
const topicFor = p => S.notifyPrefix ? `${S.notifyPrefix}-${p}` : '';
function wants(p, key){ const rp = S.rprefs[p]; return !key || !rp || rp[key] !== false; }
function notify(p, title, message, opts){
  opts = opts || {};

  if (!topic || !wants(p, opts.pref)) return Promise.resolve(false);
  const body = {topic, title: String(title).slice(0, 200), message: String(message || ' ').slice(0, 1000), priority: opts.priority || 3, tags: opts.tags || [], click: appUrl() + (opts.itemId ? '#item=' + opts.itemId : '')};
  return fetch('https://ntfy.sh/', {method:'POST', body: JSON.stringify(body)}).then(r => r.ok).catch(() => false);
}

  const B = [
    {key:'late', label: ctx === 'hw' ? 'Überfällig' : 'Vergangen', cls:'late', items:[]},
    {key:'today', label:'Heute', items:[]},
    {key:'tomorrow', label:'Morgen', items:[]},
    {key:'week', label:'Nächste Tage', items:[]},
    {key:'later', label:'Später', items:[]},
    {key:'nodate', label:'Ohne Datum', items:[]}
  ];
  sorted.forEach(i => {
    if (!i.due) return B[5].items.push(i);
    const d = daysUntil(i.due);
    B[d < 0 ? 0 : d === 0 ? 1 : d === 1 ? 2 : d <= 6 ? 3 : 4].items.push(i);
  });
  if (ctx === 'hw' && P.hwFilter !== 'open'){ B[0].label = 'Vergangen'; B[0].cls = ''; }
  return B.filter(g => g.items.length);
}
function listHTML(groups, empty){
  if (!S.loaded) return '<p class="skel">Lade eure Einträge …</p>';
  if (!groups.length) return empty;
  return `<div class="groups">${groups.map(g => `<section class="group"><h2 class="group-h ${g.cls || ''}">${g.label}<span class="count">${g.items.length}</span></h2><div class="cards">${g.items.map(cardHTML).join('')}</div></section>`).join('')}</div>`;
}
function emptyBox(title, text, kind){

function subjSelect(){

/* ---------- Rendern ---------- */
function render(force){
  const main = $('#main');
  const ae = document.activeElement;
  const typing = ae && main.contains(ae) && (ae.tagName === 'TEXTAREA' || (ae.tagName === 'INPUT' && !['checkbox','radio','color','button'].includes(ae.type)));
  if (typing && !force){ S.deferred = true; return; }
  S.deferred = false;
  const focusId = ae && main.contains(ae) ? ae.id : null;
  const v = S.view;
  main.innerHTML = v === 'hw' ? viewHw() : v === 'ex' ? viewEx() : v === 'settings' ? viewSettings() : viewHome();
  if (focusId){ const el = document.getElementById(focusId); if (el) el.focus({preventScroll:true}); }
}

  const root = $('#modal-root');

  root.hidden = true; root.innerHTML = '';

async function saveItem(form){

  }
  const id = form.dataset.id;
  const old = id && S.items.find(i => i.id === id);

async function prepareFile(f){
  let type = f.type || '';
  if (!type && /\.pdf$/i.test(f.name)) type = 'application/pdf';
  const needsConvert = /^image\/(heic|heif)$/i.test(type) || (/^image\/(jpeg|png|webp)$/.test(type) && f.size > 1.5 * 1048576);
  if (needsConvert && window.createImageBitmap){
    try {
      const bmp = await createImageBitmap(f);
      const scale = Math.min(1, 2200 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .86));
      if (blob) return {blob, type:'image/jpeg'};
    } catch(e){}
  }
  return {blob: f, type};
}
function uploadErr(e, name){
  const c = e && e.code;
  if (c === 'too_large') return `${name} ist zu groß (höchstens 20 MB).`;
  if (c === 'unsupported_type') return `${name}: Dieses Dateiformat geht nicht. Nimm JPG, PNG oder PDF.`;
  if (c === 'quota_or_state') return 'Der Speicher für Dateien ist voll. Lösche alte Notizen mit Anhängen.';
  if (c === 'rate_limited') return 'Zu viele Uploads auf einmal. Warte kurz und versuch es nochmal.';
  if (c === 'not_granted' || c === 'capability_disabled') return 'Hochladen ist hier nicht erlaubt. Du brauchst Bearbeitungsrechte.';
  return `${name} konnte nicht hochgeladen werden.`;
}
async function sendNote(){
  const id = S.openId; if (!id) return;
  if (!P.me) return askWho(() => openDetail(id));
  const ta = $('#note-text'), btn = $('#note-send');
  const text = ta.value.trim();
  const files = S.pendingFiles.slice();
  if (!text && !files.length){ ta.focus(); return; }
  btn.disabled = true; btn.textContent = files.length ? 'Lädt hoch …' : 'Sendet …';
  const up = [];
  for (const f of files){
    try {
      const {blob, type} = await prepareFile(f);
      let r;
      try { r = await S.assets.upload(blob, type ? {type} : undefined); }
      catch(e){ if (e && e.code === 'store_unavailable'){ await sleep(800); r = await S.assets.upload(blob, type ? {type} : undefined); } else throw e; }
      up.push({id: r.id, name: f.name.slice(0, 120), type: r.contentType, size: r.sizeBytes});
    } catch(e){ toast(uploadErr(e, f.name), 'err'); }
  }
  if (!text && !up.length){ btn.disabled = false; btn.textContent = 'Senden'; return; }
  try {
    const ts = Date.now();
    await write(`items/${id}/notes/${Store.newId()}`, 'set', {by: P.me, text, ts, files: up});
    write(`items/${id}`, 'update', {hasNotes: true, lastNoteAt: ts, lastNoteBy: P.me}).catch(() => {});
    const it = S.items.find(x => x.id === id);
    notify(other(P.me), `${pn(P.me)} zu „${it ? it.title : 'Eintrag'}“`, text || (up.length === 1 ? '1 Datei angehängt' : up.length + ' Dateien angehängt'), {pref:'notifyNotes', tags:['paperclip'], itemId: id});
    S.seen[id] = ts + 1; LS.set('vm-seen', S.seen);
    if ($('#note-text')){ $('#note-text').value = ''; S.pendingFiles = []; renderPending(); }
  } catch(e){}
  const b = $('#note-send'); if (b){ b.disabled = false; b.textContent = 'Senden'; }
}

function onSignals(){
  const inc = incomingHelp();
  inc.forEach(p => {
    const s = S.signals[p];
    if (s.ts > S.helpSeen){
      S.helpSeen = s.ts; LS.set('vm-help-seen', s.ts);
      if (P.sound) chime();
      const what = s.type === 'together' ? 'möchte es zusammen machen' : 'braucht Hilfe';
      toast(`${pn(p)} ${what}${s.reason ? ': ' + s.reason : ''}`, 'help');
    }
  });
  const mine = P.me && S.signals[P.me];
  if (mine && helpActive(mine) && mine.ack && mine.ack.ts > S.ackSeen){
    S.ackSeen = mine.ack.ts; LS.set('vm-ack-seen', S.ackSeen);
    toast(`${pn(mine.ack.by)} meldet sich gleich`, 'help');
  }
  renderBanner(); renderChrome();
}
function runReminders(){
  if (!S.loaded || !S.prefsReady || !P.me) return;
  const tk = todayKey();
  const fresh = reminders().filter(i => !SS.has(`rem:${i.id}:${tk}`));
  fresh.slice(0, 3).forEach((i, n) => {
    SS.add(`rem:${i.id}:${tk}`);
    const d = daysUntil(i.due);
    const when = d < 0 ? 'ist überfällig' : d === 0 ? 'ist heute dran' : d === 1 ? 'ist morgen dran' : `ist in ${d} Tagen dran`;
    setTimeout(() => toast(`${i.kind === 'hw' ? 'Hausaufgabe' : KINDS[i.kind].label} ${subj(i.subject).name}: ${i.title} ${when}`), 300 + n * 500);
  });
  if (fresh.length > 3){ fresh.slice(3).forEach(i => SS.add(`rem:${i.id}:${tk}`)); setTimeout(() => toast(`… und ${fresh.length - 3} weitere. Schau unter „Bald fällig“.`), 2000); }
}

function subscribe(){
  Store.watchCollection('items', list => { S.items = list; S.loaded = true; onData(); }, () => toast('Die Verbindung ist abgebrochen. Lade die Seite neu.', 'err'));
  Store.watchCollection('prefs', list => { const m = {}; list.forEach(d => m[d.id] = d); S.rprefs = m; applyRemotePrefs(); });
  Store.watchCollection('signals', list => { const m = {}; list.forEach(s => m[s.id] = s); S.signals = m; onSignals(); }, () => {});
  Store.watchCollection('config', list => {
    list.forEach(d => {
      if (d.id === 'subjects' && Array.isArray(d.list) && d.list.length) S.subjects = d.list.filter(s => s && s.id);
      if (d.id === 'notify' && d.prefix) S.notifyPrefix = String(d.prefix);

  }, () => {});
}

  return `<section class="login"><div class="login-duo">${av('V', 'lg')}${av('M', 'lg')}</div><h1>Hausaufgaben</h1>
    <p class="lead">Gib euer gemeinsames Passwort ein. Danach bleibst du auf diesem Gerät angemeldet.</p>
    <form id="login-form" class="form"><label class="field"><span>Passwort</span><input class="input" type="password" id="login-pw" name="pw" autocomplete="current-password" required></label>${err ? `<p class="err">${esc(err)}</p>` : ''}<button class="btn primary" type="submit">Anmelden</button></form></section>`;
}
async function doLogin(form){
  const pw = $('#login-pw').value;
  const btn = form.querySelector('[type=submit]');
  btn.disabled = true; btn.textContent = 'Melde an …';
  let error = null;
  try { ({error} = await S.sb.auth.signInWithPassword({email: CFG.loginEmail, password: pw})); } catch(e){ error = e; }
  if (error){
    lockScreen(viewLogin(/invalid|credentials/i.test(String(error.message)) ? 'Das Passwort stimmt nicht.' : 'Anmelden ging nicht. Prüfe die Internetverbindung.'));
    setTimeout(() => { const i = $('#login-pw'); if (i) i.focus(); }, 30);
    return;
  }
  start();
}
function openFromHash(){
  const m = /item=([A-Za-z0-9_-]+)/.exec(location.hash || '');
  if (!m || !S.loaded) return;
  history.replaceState(null, '', location.pathname + location.search);
  if (S.items.find(i => i.id === m[1])) openDetail(m[1]);
}
async function start(){
  document.body.classList.remove('locked');
  S.assets = Files;
  render(true); renderChrome();
  subscribe();
  try { await Store.loadAll(); }
  catch(e){ toast('Daten konnten nicht geladen werden. Prüfe die Verbindung und lade die Seite neu.', 'err'); return; }
  Store.connect();
  if (!Store.cache.has('config/notify')){
    const a = new Uint8Array(16); crypto.getRandomValues(a);
    write('config/notify', 'set', {prefix: 'hausaufgaben-' + Array.from(a, b => (b % 36).toString(36)).join('')}).catch(() => {});
  }
  S.prefsReady = true;
  if (!P.me) askWho(); else applyRemotePrefs();
  render(true); renderChrome(); runReminders();
}
async function init(){
  $('#lb-open').innerHTML = ic('ext', 18); $('#lightbox [data-action=lb-close]').innerHTML = ic('x', 18);
  const ok = window.supabase && /^https:\/\/.+/.test(CFG.supabaseUrl || '') && !/DEIN/.test(String(CFG.supabaseUrl) + String(CFG.supabaseAnonKey)) && CFG.loginEmail;
  if (!ok){
    lockScreen(`<section class="login"><h1>Fast fertig</h1><p class="lead">${window.supabase ? 'Die Datei <b>config.js</b> ist noch nicht ausgefüllt. Trag dort die Supabase-Adresse und den Schlüssel ein, wie in der Anleitung beschrieben.' : 'Die Supabase-Bibliothek konnte nicht geladen werden. Prüfe die Internetverbindung und lade die Seite neu.'}</p></section>`);
    return;
  }
  S.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth: {persistSession: true, autoRefreshToken: true}});
  S.sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') location.reload(); });
  let session = null;
  try { const r = await S.sb.auth.getSession(); session = r.data && r.data.session; } catch(e){}
  if (session) start(); else lockScreen(viewLogin());
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
}
window.addEventListener('hashchange', openFromHash);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Store.loaded) Store.loadAll().catch(() => {});
});

/* ---------- Ereignisse ---------- */
const ACTIONS = {
  nav(el){ S.view = el.dataset.view; LS.set('vm-view', S.view); render(true); renderChrome(); window.scrollTo(0, 0); },
  seg(el){ setPref(el.dataset.k, el.dataset.v); },
  month(el){
    const d = +el.dataset.d;
    if (d === 0){ const n = new Date(); S.month = new Date(n.getFullYear(), n.getMonth(), 1); S.selDay = todayKey(); }
    else { S.month = new Date(S.month.getFullYear(), S.month.getMonth() + d, 1); S.selDay = monthKey(S.month) === todayKey().slice(0, 7) ? todayKey() : keyOf(S.month); }
    render(true);
  },
  day(el){
    S.selDay = el.dataset.day;
    const dt = parseKey(S.selDay);
    if (dt.getMonth() !== S.month.getMonth()) S.month = new Date(dt.getFullYear(), dt.getMonth(), 1);
    render(true);
    if (window.innerWidth < 1120){ const p = $('.daypanel'); if (p) p.scrollIntoView({behavior:'smooth', block:'nearest'}); }
  },
  add(el){ if (!P.me) return askWho(() => openForm(null, {date: el.dataset.date, kind: el.dataset.kind})); openForm(null, {date: el.dataset.date, kind: el.dataset.kind}); },
  open(el){ openDetail(el.dataset.id); },
  edit(el){ const i = S.items.find(x => x.id === el.dataset.id); if (i) openForm(i); },
  'back-detail'(el){ openDetail(el.dataset.id); },
  'close-modal'(){ closeModal(); },
  'toggle-done'(el){
    if (!P.me) return askWho();
    const p = el.dataset.p; if (p !== P.me) return;
    const i = S.items.find(x => x.id === el.dataset.id); if (!i) return;
    const v = !(i.done && i.done[p]);
    write(`items/${i.id}`, 'update', {done:{[p]: v}}).catch(() => {});
    if (v){
      toast('Erledigt. Stark!');
      if (!(i.done || {})[other(p)]) notify(other(p), `${pn(p)} ist fertig`, `${subj(i.subject).name}: ${i.title}. Brauchst du Hilfe oder wollt ihr es zusammen machen? Tippe hier.`, {pref:'notifyDone', priority: 2, tags:['white_check_mark'], itemId: i.id});
    }
  },
  'del-item'(el){ deleteItem(el.dataset.id); },
  'del-note'(el){ deleteNote(el.dataset.nid); },
  'del-topic'(el){
    const i = S.items.find(x => x.id === S.openId); if (!i) return;
    write(`items/${i.id}`, 'update', {topics: (i.topics || []).filter(t => t.id !== el.dataset.tid)}).catch(() => {});
  },
  unpend(el){ S.pendingFiles.splice(+el.dataset.n, 1); renderPending(); },
  lightbox(el){ const lb = $('#lightbox'); $('#lb-img').src = el.dataset.src; $('#lb-open').href = el.dataset.src; lb.hidden = false; },
  'lb-close'(){ $('#lightbox').hidden = true; $('#lb-img').removeAttribute('src'); },
  help(el){ openHelp(el.dataset.id); },
  nudge(el){ openNudge(el.dataset.id); },
  ask(el){ sendAsk(el.dataset.type, el.dataset.id); },
  'end-help'(){ endHelp(); },
  ack(el){ ackHelp(el.dataset.p); },
  'pick-me'(el){
    setPref('me', el.dataset.p);
    if (!$('#modal-root').hidden && $('.who-pick', $('#modal-root'))){ const cb = S.afterPick; S.afterPick = null; closeModal(); toast(`Hallo ${pn(el.dataset.p)}!`); if (cb) cb(); }
    onSignals();
  },
  palette(el){ setPref('palette', el.dataset.v); },
  'main-only'(){ S.ui.mainOnly = !S.ui.mainOnly; render(true); },
  'subj-main'(el){ const n = +el.dataset.n; S.subjects = S.subjects.map((s, k) => k === n ? Object.assign({}, s, {main: !s.main}) : s); saveSubjects(); render(true); },
  'subj-del'(el){ const n = +el.dataset.n; S.subjects = S.subjects.filter((s, k) => k !== n); saveSubjects(); render(true); },
  'subj-add'(){
    const colors = ['#E4572E','#2364AA','#4C9F38','#8D6A9F','#17A398','#F4A259','#BC4749','#5E60CE'];
    const s = {id: 's' + Store.newId(), name: 'Neues Fach', color: colors[S.subjects.length % colors.length], main:false};
    S.subjects = S.subjects.concat([s]); saveSubjects(); render(true);
    const inp = document.getElementById('sn-' + s.id); if (inp){ inp.focus(); inp.select(); }
  },
  'copy-topic'(){
    const t = topicFor(P.me);
    const done = () => toast('Kanalname kopiert');
    try { navigator.clipboard.writeText(t).then(done, () => toast('Kopieren ging nicht. Markiere den Namen und kopiere ihn selbst.', 'err')); }
    catch(e){ toast('Kopieren ging nicht. Markiere den Namen und kopiere ihn selbst.', 'err'); }
  },
  'test-notify'(el){
    el.disabled = true;
    notify(P.me, 'Test von Hausaufgaben V&M', 'Wenn du das siehst, klappen die Benachrichtigungen.', {priority: 4, tags: ['tada']})
      .then(ok => { el.disabled = false; toast(ok ? 'Gesendet. Ist die Nachricht auf deinem Handy angekommen?' : 'Senden ging nicht. Prüfe die Internetverbindung.', ok ? '' : 'err'); });
  },
  logout(){ S.sb.auth.signOut().catch(() => location.reload()); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const a = el.dataset.action;
  if (el.dataset.confirm && !el.dataset.armed){
    e.preventDefault();
    el.dataset.armed = '1';
    const span = el.querySelector('span');
    const old = span ? span.textContent : null;
    if (span) span.textContent = 'Wirklich löschen?';
    el.title = 'Nochmal tippen zum Löschen';
    setTimeout(() => { if (el.isConnected){ delete el.dataset.armed; if (span) span.textContent = old; } }, 3500);
    return;
  }
  if (ACTIONS[a]){ if (el.tagName === 'A') return; e.preventDefault(); ACTIONS[a](el, e); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if (!$('#lightbox').hidden) ACTIONS['lb-close']();
    else if (!$('#modal-root').hidden) closeModal();
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('card')){ e.preventDefault(); openDetail(e.target.dataset.id); }
});
document.addEventListener('submit', e => {
  const f = e.target;
  e.preventDefault();
  if (f.id === 'item-form') saveItem(f);
  else if (f.id === 'note-form') sendNote();
  else if (f.id === 'login-form') doLogin(f);
  else if (f.id === 'help-form') sendHelp(f);
  else if (f.id === 'topic-form'){
    const inp = $('#topic-input'); const text = inp.value.trim();
    const i = S.items.find(x => x.id === S.openId);
    if (!text || !i) return;
    inp.value = '';
    write(`items/${i.id}`, 'update', {topics: (i.topics || []).concat([{id: Store.newId(), text: text.slice(0, 140)}])}).catch(() => {});
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.name === 'kind' && t.form && t.form.id === 'item-form') updateFormKind(t.form);
  else if (t.id === 'note-file'){
    const add = Array.from(t.files || []).slice(0, 10);
    S.pendingFiles = S.pendingFiles.concat(add).slice(0, 10);
    t.value = ''; renderPending();
  }
  else if (t.id === 'f-subj'){ S.ui.subj = t.value; render(true); }
  else if (t.dataset.pref){ const v = t.type === 'checkbox' ? t.checked : (isNaN(+t.value) ? t.value : +t.value); setPref(t.dataset.pref, v); }
  else if (t.dataset.subj !== undefined){
    const n = +t.dataset.subj, f = t.dataset.f;
    let v = t.value; if (f === 'name'){ v = v.trim().slice(0, 30); if (!v) return render(true); }
    S.subjects = S.subjects.map((s, k) => k === n ? Object.assign({}, s, {[f]: v}) : s);
    saveSubjects();
  }
  else if (t.dataset.name){
    const p = t.dataset.name;
    const people = {V: Object.assign({}, S.people.V), M: Object.assign({}, S.people.M)};
    people[p].name = t.value.trim().slice(0, 24);
    S.people = people;
    write('config/people', 'set', people).catch(() => {});
    renderChrome(); renderBanner();
  }
});
document.addEventListener('focusout', e => {
  if (S.deferred && $('#main').contains(e.target)) setTimeout(() => { if (S.deferred) render(); }, 0);
});
setInterval(() => {
  if (todayKey() !== S.today){ S.today = todayKey(); render(); renderChrome(); runReminders(); }
  renderBanner();
}, 60000);

init();
})();
</script>
</body>
</html>
